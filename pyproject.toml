[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmsampler"
version = "0.1.0"
description = "Joint active sampling and frozen-diffusion posterior correction for radio maps"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "Pillow>=9,<13"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]
inference = ["torch>=2.4,<3", "torchvision>=0.19", "einops>=0.8", "ema-pytorch>=0.7", "accelerate>=1", "denoising-diffusion-pytorch>=2.2", "fvcore>=0.1.5", "omegaconf>=2.3", "pytorch-lightning>=2", "timm>=1", "tqdm>=4", "opencv-python-headless>=4.8,<5", "requests>=2.31"]

[project.scripts]
rmsampler = "rmsampler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rmsampler.backbones" = ["LICENSE-MIT", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
